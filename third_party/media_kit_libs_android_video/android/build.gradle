import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Keep the recent libmpv/libplacebo build in-repo so release builds are
        // reproducible and do not silently fall back to the old non-Dolby binary.
        def filesToDownload = [
            ["md5": "f9c45d225b48963308c48b5f6b736340", "source": file("$projectDir/libmpv/v2026.04.25/default-arm64-v8a.jar"), "destination": file("$buildDir/v2026.04.25/default-arm64-v8a.jar")],
            ["md5": "48c47a782681d928119c7a5f064e7991", "source": file("$projectDir/libmpv/v2026.04.25/default-armeabi-v7a.jar"), "destination": file("$buildDir/v2026.04.25/default-armeabi-v7a.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists() && fileInfo.source.exists()) {
                destFile.parentFile.mkdirs()
                copy {
                    from fileInfo.source
                    into destFile.parentFile
                }
                println "Using local file: ${fileInfo.source}"
            }

            if (!destFile.exists()) {
                throw new GradleException("Missing vendored libmpv archive: ${fileInfo.source}")
            }

            def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
            if (calculatedMD5 != fileInfo.md5) {
                throw new GradleException("MD5 verification failed for ${destFile}")
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
