name: Flutter Build

on:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]*"
      - "v[0-9]*"
    paths:
      - "apps/player_flutter/**"
      - "crates/player_core/**"
      - "third_party/media_kit_libs_android_video/**"
      - "third_party/libmpv_windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "apps/player_flutter/**"
      - "crates/player_core/**"
      - "third_party/media_kit_libs_android_video/**"
      - "third_party/libmpv_windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: apps/player_flutter
  FLUTTER_VERSION: "3.41.7"

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: true
          link-to-sdk: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        working-directory: .
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Rust core for Flutter tests
        working-directory: .
        run: cargo build -p player_core --release

      - name: Flutter tests
        run: flutter test --no-pub

      - name: Android TVBox bridge tests
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew :app:testDebugUnitTest --tests com.example.player_flutter.TvboxBridgeTest --no-daemon

      - name: Check Android Python requirements
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew :app:installDebugPythonRequirements --rerun-tasks --no-daemon

      - name: Build Rust core for Android
        working-directory: .
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rm -rf apps/player_flutter/android/app/src/main/jniLibs
          cargo ndk \
            --link-libcxx-shared \
            -t arm64-v8a \
            -o apps/player_flutter/android/app/src/main/jniLibs \
            build -p player_core --release
          test -f apps/player_flutter/android/app/src/main/jniLibs/arm64-v8a/libplayer_core.so
          rm -f apps/player_flutter/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 --android-project-arg=targetAbi=arm64-v8a --no-pub
          mkdir -p build/ci
          cp build/app/outputs/flutter-apk/app-release.apk build/ci/rplayer-android-arm64-v8a.apk

      - name: Check APK contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("build/ci/rplayer-android-arm64-v8a.apk")
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              libraries = {name for name in names if name.startswith("lib/")}

          abis = {name.split("/", 2)[1] for name in libraries}
          if abis != {"arm64-v8a"}:
              raise SystemExit(f"Unexpected APK ABIs: {sorted(abis)}")

          required = {
              "assets/flutter_assets/android/app/src/main/assets/js/lib/net.js",
              "assets/chaquopy/app.imy",
              "lib/arm64-v8a/libapp.so",
              "lib/arm64-v8a/libc++_shared.so",
              "lib/arm64-v8a/libflutter.so",
              "lib/arm64-v8a/libmediakitandroidhelper.so",
              "lib/arm64-v8a/libmpv.so",
              "lib/arm64-v8a/libplayer_core.so",
              "lib/arm64-v8a/libpython3.13.so",
              "lib/arm64-v8a/libquickjs-android-wrapper.so",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Missing APK entries: {sorted(missing)}")

          print("\n".join(sorted(libraries)))
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-android-arm64-v8a
          path: apps/player_flutter/build/ci/rplayer-android-arm64-v8a.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: TVBox tests
        run: flutter test test/tvbox_test.dart --no-pub

      - name: Build Windows app
        run: flutter build windows --release --no-pub

      - name: Bundle Windows Python runtime
        shell: pwsh
        run: |
          $pythonHome = python -c "import pathlib, sys; print(pathlib.Path(sys.executable).parent)"
          $runtime = "build\windows\x64\runner\Release\tvbox_runtime\python"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item -Path (Join-Path $pythonHome "*") -Destination $runtime -Recurse -Force
          python -m pip install --upgrade --target "$runtime\Lib\site-packages" `
            requests lxml pyquery cachetools pycryptodome beautifulsoup4

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $languageDir = Join-Path (Split-Path $iscc -Parent) "Languages"
          New-Item -ItemType Directory -Force $languageDir | Out-Null
          curl.exe --fail -L -o (Join-Path $languageDir "ChineseSimplified.isl") "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\ci | Out-Null
          Remove-Item build\windows\x64\runner\Release\rplayer_data -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build\windows\x64\runner\Release\player_diagnostic_logs_*.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\ci\rplayer-windows-x64.zip -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $versionLine = Select-String -Path pubspec.yaml -Pattern "^version:" | Select-Object -First 1
          $appVersion = ($versionLine.Line -replace "^version:\s*", "") -replace "\+.*$", ""
          $release = (Resolve-Path build\windows\x64\runner\Release).Path
          $output = (Resolve-Path build\ci).Path
          & $iscc windows\installer\rplayer.iss "/DAppVersion=$appVersion" "/DReleaseDir=$release" "/DOutputDir=$output"

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-windows-x64-portable
          path: apps/player_flutter/build/ci/rplayer-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-windows-x64-installer
          path: apps/player_flutter/build/ci/rplayer-windows-x64-setup.exe
          if-no-files-found: error
