name: Flutter Build

on:
  push:
    paths:
      - "apps/player_flutter/**"
      - "third_party/media_kit_libs_android_video/**"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "apps/player_flutter/**"
      - "third_party/media_kit_libs_android_video/**"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/player_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug --no-pub
