name: Flutter Build

on:
  push:
    paths:
      - "apps/player_flutter/**"
      - "crates/player_core/**"
      - "third_party/media_kit_libs_android_video/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "apps/player_flutter/**"
      - "crates/player_core/**"
      - "third_party/media_kit_libs_android_video/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/player_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        working-directory: .
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Build Rust core for Android
        working-directory: .
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rm -rf apps/player_flutter/android/app/src/main/jniLibs
          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86_64 \
            -o apps/player_flutter/android/app/src/main/jniLibs \
            build -p player_core --release
          find apps/player_flutter/android/app/src/main/jniLibs -name "libplayer_core.so" -print

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; release APKs will use the default debug signing key."
            exit 0
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Android signing secrets are incomplete." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_STORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-pub

      - name: Build Android Release APKs by ABI
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/player_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release-apk
          path: apps/player_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload Release APK - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-apk
          path: apps/player_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Release APK - x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release-apk
          path: apps/player_flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      - name: Upload Rust Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: player-core-android-libs
          path: apps/player_flutter/android/app/src/main/jniLibs/**/libplayer_core.so
          if-no-files-found: error
