name: Flutter Build

on:
  push:
    paths:
      - "apps/player_flutter/**"
      - "third_party/media_kit_libs_android_video/**"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "apps/player_flutter/**"
      - "third_party/media_kit_libs_android_video/**"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/player_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-pub

      - name: Build Android Release APKs by ABI
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: player-flutter-debug-apk
          path: apps/player_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: player-flutter-release-apks
          path: apps/player_flutter/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
