name: Flutter Build

on:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]*"
    paths:
      - "apps/player_flutter/**"
      - "crates/player_core/**"
      - "third_party/media_kit_libs_android_video/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flutter-build.yml"
  pull_request:
    paths:
      - "apps/player_flutter/**"
      - "crates/player_core/**"
      - "third_party/media_kit_libs_android_video/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/flutter-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android armv7, armv8, universal
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/player_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        working-directory: .
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Build Rust/C++ core for Android
        working-directory: .
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rm -rf apps/player_flutter/android/app/src/main/jniLibs
          cargo ndk \
            --link-libcxx-shared \
            -t armeabi-v7a \
            -t arm64-v8a \
            -o apps/player_flutter/android/app/src/main/jniLibs \
            build -p player_core --release
          test -f apps/player_flutter/android/app/src/main/jniLibs/armeabi-v7a/libplayer_core.so
          test -f apps/player_flutter/android/app/src/main/jniLibs/armeabi-v7a/libc++_shared.so
          test -f apps/player_flutter/android/app/src/main/jniLibs/arm64-v8a/libplayer_core.so
          test -f apps/player_flutter/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Strip Android native libraries
        working-directory: .
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          LLVM_STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          find apps/player_flutter/android/app/src/main/jniLibs -name "*.so" -print \
            -exec "$LLVM_STRIP" --strip-unneeded {} \;
          find apps/player_flutter/android/app/src/main/jniLibs -name "*.so" -printf "%p %s bytes\n"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; release APKs will use the default debug signing key."
            exit 0
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Android signing secrets are incomplete." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_STORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Build Android armv7 APK
        run: |
          flutter build apk --release --target-platform android-arm --android-project-arg=targetAbi=armeabi-v7a --no-pub
          mkdir -p build/ci
          cp build/app/outputs/flutter-apk/app-release.apk build/ci/rplayer-android-armeabi-v7a.apk

      - name: Build Android armv8 APK
        run: |
          flutter build apk --release --target-platform android-arm64 --android-project-arg=targetAbi=arm64-v8a --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk build/ci/rplayer-android-arm64-v8a.apk

      - name: Build Android universal APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --android-project-arg=targetAbi=armeabi-v7a,arm64-v8a --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk build/ci/rplayer-android-universal.apk

      - name: Upload Android armv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-android-armeabi-v7a
          path: apps/player_flutter/build/ci/rplayer-android-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload Android armv8 APK
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-android-arm64-v8a
          path: apps/player_flutter/build/ci/rplayer-android-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload Android universal APK
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-android-universal
          path: apps/player_flutter/build/ci/rplayer-android-universal.apk
          if-no-files-found: error

      - name: Upload Rust Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: player-core-android-libs
          path: |
            apps/player_flutter/android/app/src/main/jniLibs/**/libplayer_core.so
            apps/player_flutter/android/app/src/main/jniLibs/**/libc++_shared.so
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/player_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Rust/C++ core for Windows x64
        working-directory: .
        run: cargo build -p player_core --release

      - name: Build Windows x64
        run: flutter build windows --release --no-pub

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $languageDir = Join-Path (Split-Path $iscc -Parent) 'Languages'
          New-Item -ItemType Directory -Force $languageDir | Out-Null
          curl.exe --fail -L `
            -o (Join-Path $languageDir 'ChineseSimplified.isl') `
            'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'

      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\ci | Out-Null
          Copy-Item ..\..\target\release\player_core.dll build\windows\x64\runner\Release\player_core.dll -Force
          Remove-Item build\windows\x64\runner\Release\rplayer_data -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build\windows\x64\runner\Release\player_diagnostic_logs_*.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\ci\rplayer-windows-x64.zip -Force

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Split('+')[0]
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          $release = (Resolve-Path build\windows\x64\runner\Release).Path
          $output = (Resolve-Path build\ci).Path
          & $iscc windows\installer\rplayer.iss "/DAppVersion=$version" "/DReleaseDir=$release" "/DOutputDir=$output"

      - name: Upload Windows x64 portable zip
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-windows-x64-portable
          path: apps/player_flutter/build/ci/rplayer-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: rplayer-windows-x64-installer
          path: apps/player_flutter/build/ci/rplayer-windows-x64-setup.exe
          if-no-files-found: error

  windows-x86:
    name: Windows x86 unsupported by Flutter stable
    runs-on: windows-latest
    steps:
      - name: Explain Windows x86 support
        run: |
          echo "Flutter stable does not expose a Windows x86 build target in 'flutter build windows'."
          echo "Windows x64 is built by the windows-x64 job."

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [android, windows-x64]
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version="$(awk -F': *' '/^version:/ { print $2; exit }' apps/player_flutter/pubspec.yaml)"
          app_version="${version%%+*}"
          if [ -z "$app_version" ]; then
            echo "Could not read app version from apps/player_flutter/pubspec.yaml." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$app_version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' must match app version '${app_version}'." >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rplayer-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.app_version }}" release-assets/* \
            --title "${{ steps.version.outputs.app_version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
